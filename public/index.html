<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walrus Sealed-Bid Auction — CLAY Hackathon III</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.4rem; }
  .phase { font-weight: bold; padding: .25rem .6rem; border-radius: 999px; background: #eef; display: inline-block; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
  td, th { border-bottom: 1px solid #ddd; padding: .4rem; text-align: left; font-size: .9rem; }
  code { font-size: .8rem; word-break: break-all; }
  input, button { padding: .5rem; margin: .2rem 0; font-size: 1rem; }
  input { width: 100%; box-sizing: border-box; }
  form { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  #msg { color: #a00; min-height: 1.2em; }
  .winner { background: #e6ffe6; border: 1px solid #8c8; border-radius: 8px; padding: 1rem; }
  .note { color: #555; font-size: .85rem; }
</style>
</head>
<body>
<h1>❄️ Walrus Sealed-Bid Auction</h1>
<p><strong id="item"></strong> — <span id="desc"></span></p>
<p>Phase: <span class="phase" id="phase"></span> · Min bid: <span id="minbid"></span> SUI</p>
<p class="note" id="storage"></p>
<div id="winner"></div>

<h2>Sealed bids (hashes only — amounts stay secret)</h2>
<table><thead><tr><th>Bidder</th><th>Commitment</th><th>Blob</th></tr></thead><tbody id="sealed"></tbody></table>

<h2>Revealed bids</h2>
<table><thead><tr><th>Bidder</th><th>Amount (SUI)</th></tr></thead><tbody id="reveals"></tbody></table>

<form id="bidform">
  <h3>Place a sealed bid</h3>
  <input name="bidder" placeholder="Your name" required>
  <input name="amount" type="number" min="1" step="1" placeholder="Amount in SUI" required>
  <input name="salt" placeholder="Secret word (keep it — you need it to reveal)" required>
  <button type="submit">Seal my bid</button>
  <p class="note">Only a hash of your bid is stored. Nobody can see your amount until you reveal it.</p>
</form>

<form id="revealform">
  <h3>Reveal your bid</h3>
  <input name="bidder" placeholder="Your name" required>
  <input name="amount" type="number" min="1" step="1" placeholder="Same amount as your sealed bid" required>
  <input name="salt" placeholder="Same secret word" required>
  <button type="submit">Reveal my bid</button>
</form>

<p><button id="settle">Settle auction (after reveal ends)</button></p>
<p id="msg"></p>

<script>
async function refresh() {
  const s = await (await fetch("/api/state")).json();
  document.getElementById("item").textContent = s.item;
  document.getElementById("desc").textContent = s.description;
  document.getElementById("phase").textContent = s.phase.toUpperCase();
  document.getElementById("minbid").textContent = s.minBid;
  document.getElementById("storage").textContent = "Storage: " + s.storageNote;
  document.getElementById("sealed").innerHTML = s.sealedBids.map(b =>
    `<tr><td>${b.bidder}</td><td><code>${b.commitment.slice(0, 24)}…</code></td><td><code>${b.blobId.slice(0, 12)}… (${b.backend})</code></td></tr>`).join("") || "<tr><td colspan=3>No sealed bids yet.</td></tr>";
  document.getElementById("reveals").innerHTML = s.reveals.map(r =>
    `<tr><td>${r.bidder}</td><td>${r.amount}</td></tr>`).join("") || "<tr><td colspan=2>Nothing revealed yet.</td></tr>";
  document.getElementById("winner").innerHTML = s.winner && s.winner.bidder
    ? `<div class="winner">🏆 Winner: <strong>${s.winner.bidder}</strong> — ${s.winner.amount} SUI (${s.winner.totalReveals} valid reveals)</div>`
    : (s.winner ? `<div class="winner">No valid reveals — no winner.</div>` : "");
}
async function submitForm(form, url) {
  const data = Object.fromEntries(new FormData(form).entries());
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  const out = await res.json();
  document.getElementById("msg").textContent = out.ok ? "Done." : ("Error: " + out.error);
  if (out.ok) form.reset();
  refresh();
}
document.getElementById("bidform").addEventListener("submit", e => { e.preventDefault(); submitForm(e.target, "/api/bid"); });
document.getElementById("revealform").addEventListener("submit", e => { e.preventDefault(); submitForm(e.target, "/api/reveal"); });
document.getElementById("settle").addEventListener("click", async () => {
  const res = await fetch("/api/settle", { method: "POST" });
  const out = await res.json();
  document.getElementById("msg").textContent = out.ok ? "Settled." : ("Error: " + out.error);
  refresh();
});
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
